# 本地开发：`项目根` 执行 `npm run supabase:start`（需已安装 Docker Desktop）
# 启动后 API 默认 http://127.0.0.1:54321 ，见 `npx supabase status`
# 与 ERP 联调：merchant-erp / 商家管理后台 .env.local 使用 status 中的 URL 与 anon key

project_id = "dianmofang"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://127.0.0.1:5173",
  "http://localhost:5174",
  "http://127.0.0.1:5174",
]

[auth.email]
enable_signup = true
enable_confirmations = false
