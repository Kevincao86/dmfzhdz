<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>灵祺AI智能ERP · 抖音直播全屏框</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&family=Orbitron:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #061525;
      --navy-2: #0b2238;
      --line: #1a4a6e;
      --cyan: #2ee0ff;
      --cyan-2: #0891b2;
      --text: #f4fbff;
      --muted: #9ec4d8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100%;
      background: #111;
      font-family: "Noto Sans SC", sans-serif;
    }
    .desk {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 12px 48px;
    }
    .stage {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(120% 70% at 50% 0%, #12385a 0%, transparent 55%),
        linear-gradient(180deg, #0a1c30 0%, var(--navy) 42%, #040d18 100%);
      color: var(--text);
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
    }
    .stage.obs {
      background: transparent;
      box-shadow: none;
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(46,224,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(46,224,255,.05) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 78%);
      pointer-events: none;
    }
    .circuit {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .55;
    }
    .circuit path { fill: none; stroke: var(--cyan); stroke-width: 1.4; opacity: .35; }
    .pad {
      position: relative;
      z-index: 2;
      height: 100%;
      display: grid;
      grid-template-rows: 430px 1fr 560px;
      padding: 72px 64px 80px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 700;
      letter-spacing: .28em;
      font-size: 34px;
    }
    .mark {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 18px rgba(124, 92, 255, .35);
      flex-shrink: 0;
    }
    .mark img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    h1 {
      margin-top: 36px;
      font-size: 92px;
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: .02em;
    }
    h1 em {
      font-style: normal;
      color: var(--cyan);
      text-shadow: 0 0 24px rgba(46,224,255,.35);
    }
    .sub {
      margin-top: 22px;
      font-size: 36px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: .18em;
    }
    .window-wrap {
      position: relative;
      align-self: stretch;
    }
    .window {
      position: absolute;
      inset: 8px 8px 16px;
      border-radius: 28px;
      background: transparent;
      box-shadow:
        0 0 0 3px var(--cyan),
        0 0 28px rgba(46,224,255,.28),
        inset 0 0 40px rgba(46,224,255,.06);
    }
    .stage:not(.obs) .window {
      background: #000;
    }
    .corner {
      position: absolute;
      width: 34px;
      height: 34px;
      border: 4px solid var(--cyan);
      z-index: 3;
    }
    .corner.tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; }
    .corner.tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; border-radius: 0 10px 0 0; }
    .corner.bl { bottom: 6px; left: -2px; border-right: 0; border-top: 0; border-radius: 0 0 0 10px; }
    .corner.br { bottom: 6px; right: -2px; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }
    .win-label {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--navy-2);
      color: var(--cyan);
      font-size: 26px;
      letter-spacing: .42em;
      padding: 6px 22px;
      z-index: 4;
    }
    .bottom {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding-top: 28px;
      gap: 36px;
    }
    .pills {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 22px 18px;
    }
    .pill {
      height: 86px;
      border: 2px solid rgba(46,224,255,.7);
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 30px;
      font-weight: 700;
      background: rgba(8, 28, 48, .72);
      box-shadow: inset 0 0 16px rgba(46,224,255,.08);
    }
    .pill svg { width: 28px; height: 28px; stroke: var(--cyan); fill: none; stroke-width: 1.8; }
    .cta {
      text-align: center;
    }
    .cta strong {
      display: block;
      font-size: 72px;
      font-weight: 900;
      letter-spacing: .08em;
    }
    .cta span {
      display: inline-block;
      margin-top: 10px;
      width: 18px;
      height: 18px;
      border: 2px solid var(--cyan);
      transform: rotate(45deg);
    }
    .safe {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 70px;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.35));
      pointer-events: none;
    }
    .hint {
      margin-top: 16px;
      color: #9aa;
      font-size: 13px;
      text-align: center;
    }
    .hint a { color: var(--cyan-2); }
    @media print {
      .desk { padding: 0; }
      .hint { display: none; }
      .stage { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="desk">
    <article class="stage" id="stage" data-screen-label="douyin-live-overlay">
      <div class="grid"></div>
      <svg class="circuit" viewBox="0 0 1080 1920" aria-hidden="true">
        <path d="M40 220 H180 L210 250 H320" />
        <path d="M1040 220 H900 L870 250 H760" />
        <path d="M40 1700 H200 L230 1730 H400" />
        <path d="M1040 1700 H880 L850 1730 H680" />
        <path d="M80 80 V160" />
        <path d="M1000 80 V160" />
      </svg>
      <div class="pad">
        <header>
          <div class="brand"><div class="mark"><img src="logo.png" alt="灵祺" /></div>灵祺</div>
          <h1>灵祺<em>AI</em>智能<em>ERP</em></h1>
          <p class="sub">网页版 · 小程序版　同屏演示</p>
        </header>
        <div class="window-wrap">
          <div class="win-label">展示窗口</div>
          <div class="window" id="demo-hole" aria-label="直播画面展示窗口，保持留空"></div>
          <i class="corner tl"></i><i class="corner tr"></i>
          <i class="corner bl"></i><i class="corner br"></i>
        </div>
        <div class="bottom">
          <div class="pills">
            <div class="pill"><svg viewBox="0 0 24 24"><path d="M4 6h16v10H7l-3 3V6z"/></svg>智能对话</div>
            <div class="pill"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12h8M12 8v8"/></svg>AI组品</div>
            <div class="pill"><svg viewBox="0 0 24 24"><path d="M4 18V8l5 3 6-5 5 4v8z"/></svg>运营方案</div>
            <div class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 19c1.5-3 4-5 7-5s5.5 2 7 5"/></svg>招达人</div>
            <div class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>店铺分析</div>
            <div class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg>竞品对标</div>
          </div>
          <p class="cta"><strong>搜索「灵祺AI」</strong><span></span></p>
        </div>
      </div>
      <div class="safe"></div>
    </article>
    <p class="hint">1080×1920 直播全屏框 · 中间黑色区域叠网页/小程序画面 · OBS 透明版加 <a href="?obs=1">?obs=1</a></p>
  </div>
  <script>
    if (new URLSearchParams(location.search).get("obs") === "1") {
      document.getElementById("stage").classList.add("obs");
      document.body.style.background = "transparent";
    }
  </script>
</body>
</html>
