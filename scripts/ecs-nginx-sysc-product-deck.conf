# /etc/nginx/sites-available/meoo-sysc-product-deck
# 灵祺商家 ERP 产品介绍 · sysc.mofangdianai.com 纯静态
#
# 占位符由 ecs-deploy-sysc-product-deck-web.sh 替换：
#   __SYSC_DIST__  __SYSC_SERVER_NAMES__  __SYSC_SERVER_NAMES_80__
#   __SSL_CERT__  __SSL_KEY__  __SSL_DHPARAM__

server {
    server_name __SYSC_SERVER_NAMES__;

    root __SYSC_DIST__;
    index index.html;

    location ^~ /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(css|js)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_dhparam __SSL_DHPARAM__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_buffer_size 4k;
}

server {
    listen 80;
    server_name __SYSC_SERVER_NAMES_80__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
