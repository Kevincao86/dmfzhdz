# /etc/nginx/sites-available/meoo-merchant-cs
# 商家 ERP · cs.mofangdianai.com 静态 SPA + /api、/erp-api 反代轻量
#
# 占位符由 ecs-deploy-merchant-cs-web.sh 替换

server {
    server_name __MERCHANT_SERVER_NAMES__;

    root __MERCHANT_DIST__;
    index index.html;

    location ^~ /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /digital-human/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location ^~ /ai-vendors/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /bp/ {
        try_files $uri $uri/ /bp/index.html;
    }

    location /erp-api/ {
        client_max_body_size 32m;
        gzip off;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Mp-Session, X-Meoo-Douyin-Token, X-Meoo-Kuaishou-Token, X-Meoo-Meituan-Token, X-Meoo-Xhs-Token";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Mp-Session, X-Meoo-Douyin-Token, X-Meoo-Kuaishou-Token, X-Meoo-Meituan-Token, X-Meoo-Xhs-Token" always;

        proxy_pass https://__MEOO_LIGHT_IP__/erp-api/;
        proxy_ssl_server_name off;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host mofangdianai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Supabase Auth/REST：浏览器走 cs 同源，反代轻量 IP（避免外网 SNI mofangdianai.com 握手 reset；不动轻量小程序配置）
    location /auth/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, X-Client-Info, prefer, accept-profile, content-profile, range, x-upsert, x-retry-count, count, x-supabase-api-version";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, X-Client-Info, prefer, accept-profile, content-profile, range, x-upsert, x-retry-count, count, x-supabase-api-version" always;

        proxy_pass https://__MEOO_LIGHT_IP__/auth/v1/;
        proxy_ssl_server_name off;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host mofangdianai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Supabase Realtime（在线客服等）；未配置时 wss://cs.../realtime 会反复失败
    location /realtime/v1/ {
        proxy_pass https://__MEOO_LIGHT_IP__/realtime/v1/;
        proxy_ssl_server_name off;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host mofangdianai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rest/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, X-Client-Info, prefer, accept-profile, content-profile, range, x-upsert, x-retry-count, count, x-supabase-api-version";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, apikey, X-Client-Info, prefer, accept-profile, content-profile, range, x-upsert, x-retry-count, count, x-supabase-api-version" always;

        proxy_pass https://__MEOO_LIGHT_IP__/rest/v1/;
        proxy_ssl_server_name off;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host mofangdianai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        client_max_body_size 4m;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Mp-Session, X-Meoo-Douyin-Token, X-Meoo-Kuaishou-Token, X-Meoo-Meituan-Token, X-Meoo-Xhs-Token";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Mp-Session, X-Meoo-Douyin-Token, X-Meoo-Kuaishou-Token, X-Meoo-Meituan-Token, X-Meoo-Xhs-Token" always;

        proxy_pass https://__MEOO_LIGHT_IP__/api/;
        proxy_ssl_server_name off;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_set_header X-Accel-Buffering no;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host mofangdianai.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_dhparam __SSL_DHPARAM__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_buffer_size 4k;
}

server {
    listen 80;
    server_name __MERCHANT_SERVER_NAMES_80__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
