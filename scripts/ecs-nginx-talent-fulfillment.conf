# /etc/nginx/sites-available/meoo-talent-fulfillment
# 灵祺达人履约管理后台 · 独立子域静态 SPA + /api、/erp-api 反代
#
# 占位符由 ecs-deploy-talent-fulfillment-web.sh 替换：
#   __FULFILLMENT_DIST__  __FULFILLMENT_SERVER_NAMES__  __FULFILLMENT_SERVER_NAMES_80__
#   __MEOO_API_PROXY__  __MEOO_ERP_API_PROXY__  __MEOO_API_PROXY_HOST__
#   __SSL_CERT__  __SSL_KEY__  __SSL_DHPARAM__

server {
    server_name __FULFILLMENT_SERVER_NAMES__;

    root __FULFILLMENT_DIST__;
    index index.html;

    location ^~ /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /digital-human/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /ai-vendors/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /erp-api/ {
        client_max_body_size 32m;
        gzip off;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Mp-Session";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Mp-Session" always;

        proxy_pass __MEOO_ERP_API_PROXY__;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host __MEOO_API_PROXY_HOST__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Mp-Session";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }

        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Mp-Session" always;

        proxy_pass __MEOO_API_PROXY__;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host __MEOO_API_PROXY_HOST__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_dhparam __SSL_DHPARAM__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_buffer_size 4k;
}

server {
    listen 80;
    server_name __FULFILLMENT_SERVER_NAMES_80__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
