<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="Gpt 行业岗位 AI 方案规划器 — 录入需求 · 生成方案" />
  <title>录入需求 · 行业岗位 AI 方案规划器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/planner.css" />
</head>
<body class="page-input">
  <div class="planner-shell">
    <header class="top-nav">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">AI</span>
        <div>
          <strong>行业岗位方案规划器</strong>
          <span class="brand-sub">Gpt · 智能方案生成</span>
        </div>
      </div>
      <nav class="top-tabs" aria-label="页面导航">
        <a class="top-tab active" href="index.html">录入需求</a>
        <a class="top-tab" href="summary.html">方案汇总</a>
      </nav>
    </header>

    <main class="planner-single">
      <section class="panel panel-glass" id="configPanel">
        <div class="panel-head">
          <div class="step-badge">⚙</div>
          <div>
            <h2 class="panel-heading">Gpt 连接</h2>
            <p class="panel-desc">配置一次，保存后自动隐藏密钥</p>
          </div>
        </div>
        <div id="configSummary" class="config-summary" hidden>
          <div class="config-summary-row">
            <span class="dot-ok"></span>
            <span>Gpt 已连接</span>
            <button type="button" class="link-btn" id="btnEditConfig">修改</button>
          </div>
          <p class="config-summary-meta" id="configSummaryMeta"></p>
        </div>
        <div id="configForm">
          <div class="field">
            <label class="field-label" for="cfgApiKey">API Key</label>
            <input id="cfgApiKey" type="password" placeholder="Gpt 控制台密钥" autocomplete="off" />
          </div>
          <div class="field-grid">
            <div class="field">
              <label class="field-label" for="cfgBaseUrl">Base URL</label>
              <input id="cfgBaseUrl" type="text" value="https://api.tokenmix.ai/v1" />
            </div>
            <div class="field">
              <label class="field-label" for="cfgTextModel">文本模型</label>
              <input id="cfgTextModel" type="text" value="gpt-4o-mini" />
            </div>
            <div class="field">
              <label class="field-label" for="cfgImageModel">文生图模型</label>
              <input id="cfgImageModel" type="text" value="dall-e-3" />
            </div>
          </div>
          <button type="button" class="btn btn-primary btn-block" id="btnSaveConfig">保存并隐藏密钥</button>
          <div class="status-line" id="configStatus"></div>
        </div>
      </section>

      <section class="panel panel-glass">
        <div class="panel-head">
          <div class="step-badge">1</div>
          <div>
            <h2 class="panel-heading">选择行业</h2>
            <p class="panel-desc">预设 34 个行业分类</p>
          </div>
        </div>
        <div class="field">
          <select id="selIndustry">
            <option value="">请选择行业</option>
          </select>
        </div>
      </section>

      <section class="panel panel-glass">
        <div class="panel-head">
          <div class="step-badge">2</div>
          <div>
            <h2 class="panel-heading">选择岗位</h2>
            <p class="panel-desc">AI 按行业预设岗位列表</p>
          </div>
        </div>
        <div class="field">
          <select id="selRole" disabled>
            <option value="">请先选择行业</option>
          </select>
        </div>
        <button type="button" class="btn btn-ghost btn-sm btn-block" id="btnReloadRoles">重新加载岗位</button>
        <div class="status-line" id="roleStatus"></div>
      </section>

      <section class="panel panel-glass panel-accent">
        <div class="panel-head">
          <div class="step-badge">3</div>
          <div>
            <h2 class="panel-heading">输入需求</h2>
            <p class="panel-desc">描述该岗位要解决的问题</p>
          </div>
        </div>
        <div class="field">
          <textarea
            id="reqInput"
            disabled
            placeholder="例：销售每天手工整理询盘，希望 AI 自动分类、生成回复草稿并同步 CRM…"
          ></textarea>
        </div>
        <button type="button" class="btn btn-primary btn-block btn-glow" id="btnAddEntry" disabled>
          生成方案并加入汇总
        </button>
        <div class="status-line" id="addStatus"></div>
        <p class="hint-link">完整汇总与整体设计请前往 <a href="summary.html">方案汇总</a></p>
      </section>

      <section class="panel panel-glass panel-result" id="resultPanel" hidden>
        <div class="panel-head">
          <div class="step-badge">4</div>
          <div>
            <h2 class="panel-heading">生成结果</h2>
            <p class="panel-desc">本页即时展示 AI 生成的方案与工作流</p>
          </div>
        </div>
        <div class="req-list" id="inputResultList"></div>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="pwdModal" hidden aria-hidden="true">
    <div class="modal-card" role="dialog" aria-labelledby="pwdModalTitle">
      <h3 class="modal-title" id="pwdModalTitle">验证密码</h3>
      <p class="modal-desc">修改 Gpt 配置需输入管理密码</p>
      <div class="field">
        <input id="pwdInput" type="password" placeholder="请输入密码" autocomplete="off" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="btnPwdCancel">取消</button>
        <button type="button" class="btn btn-primary" id="btnPwdConfirm">确认</button>
      </div>
      <div class="status-line" id="pwdStatus"></div>
    </div>
  </div>

  <script src="js/planner-api.js"></script>
  <script src="js/planner-store.js"></script>
  <script src="js/planner-app.js"></script>
</body>
</html>
